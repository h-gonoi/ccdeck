<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
@font-face{font-family:'Dot';src:url(__FONT__) format('truetype');font-display:block}
html,body{margin:0;background:#131311;color:#e6e3dc;-webkit-text-size-adjust:100%}
body{font:15px/1.55 'Dot',-apple-system,'Hiragino Sans',sans-serif;padding:6px 14px 14px;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;word-break:break-word;overflow-wrap:anywhere}
.turn{padding:8px 0}
.who{font-size:11px;color:#5c5a54;letter-spacing:1px;margin-bottom:4px}
.me{border-left:2px solid #e0a145;padding-left:10px;margin-left:2px}
.me .who{color:#e0a145}
.me .body{color:#8d8a82}
.body p{margin:0 0 8px}
.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{font-size:16px;margin:12px 0 6px;color:#e6e3dc}
.body ul,.body ol{margin:0 0 8px;padding-left:22px}
.body li{margin:2px 0}
.body code{font-family:Menlo,ui-monospace,monospace;font-size:13px;background:#191917;padding:1px 4px}
.body pre{background:#191917;border:1px solid #232220;padding:8px 10px;margin:6px 0 10px;overflow-x:auto;
  font-size:12px;line-height:1.45;-webkit-overflow-scrolling:touch}
.body pre code{background:none;padding:0;font-size:12px}
.body table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;margin:6px 0 10px}
.body th,.body td{border:1px solid #2b2a26;padding:3px 7px;text-align:left;white-space:nowrap}
.body th{color:#8d8a82;font-weight:normal}
.body blockquote{margin:0 0 8px;padding-left:10px;border-left:2px solid #2b2a26;color:#8d8a82}
.body hr{border:0;border-top:1px solid #232220;margin:10px 0}
.body b{color:#f0ece2}
.body .url{color:#5c5a54;font-size:12px}
.tool{color:#5c5a54;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{color:#5c5a54;font-size:13px;padding:12px 0}
pre.screen{font:10px/14px Menlo,ui-monospace,monospace;white-space:pre;color:#e6e3dc;margin:0;padding:4px 0;overflow-x:auto}
</style>
<div id="root"></div>
<script>
/* 会話と画面の文字を描く。文字を選んでコピーするのは WKWebView に任せる
   （RN の Text は iOS で全文しか選べず、TextInput は高さが狂う）。Markdown → HTML は RN 側で済ませてある。 */
const root=document.getElementById('root');
const post=(m)=>window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(JSON.stringify(m));
const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let stick=true, lastKind='';
function nearBottom(){ return document.documentElement.scrollHeight-window.scrollY-window.innerHeight<80; }
function render(m){
  if(m.t==='chat'){
    stick = lastKind!=='chat' || nearBottom() || m.force;
    root.innerHTML = m.turns.map((tn)=>
      '<div class="turn'+(tn.me?' me':'')+'"><div class="who">'+esc(tn.who)+'</div>'
      +(tn.html?'<div class="body">'+tn.html+'</div>':'')
      +(tn.tools||[]).map((x)=>'<div class="tool">▸ '+esc(x)+'</div>').join('')
      +'</div>').join('') || '<div class="hint">'+esc(m.empty||'')+'</div>';
    if(stick) window.scrollTo(0, document.documentElement.scrollHeight);
  } else if(m.t==='screen'){
    root.innerHTML='<pre class="screen">'+esc(m.text)+'</pre>';
    window.scrollTo(0,0);
  } else if(m.t==='hint'){
    root.innerHTML='<div class="hint">'+esc(m.text)+'</div>';
  }
  lastKind=m.t;
}
function onMsg(ev){ try{ render(JSON.parse(ev.data)); }catch(e){ post({t:'error',msg:String(e)}); } }
document.addEventListener('message',onMsg); window.addEventListener('message',onMsg);
window.addEventListener('scroll',()=>{ stick=nearBottom(); },{passive:true});
document.fonts.load('16px Dot').then(()=>document.fonts.ready).catch(()=>{}).then(()=>post({t:'ready'}));
</script>
