<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ccdeck app icon</title>
  <desc id="desc">Three bundled panes with one amber active pane.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201f1c"/>
      <stop offset="0.58" stop-color="#191917"/>
      <stop offset="1" stop-color="#131311"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#efb75d"/>
      <stop offset="1" stop-color="#e0a145"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dedbd4"/>
      <stop offset="1" stop-color="#aaa8a2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <!-- The clip follows the foreground frame's inner edge, not its outer silhouette. -->
    <clipPath id="frontInterior">
      <rect x="474" y="418" width="236" height="292" rx="32"/>
    </clipPath>
  </defs>

  <!-- Big Sur-style 824 pt tile, centered on a transparent canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#surface)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="url(#tileEdge)" stroke-width="8"/>

  <g filter="url(#shadow)">
    <!-- Quiet sessions: complete frames, hidden only by the panes drawn over them. -->
    <g>
      <rect x="270" y="294" width="260" height="316" rx="44" fill="#171715"/>
      <path d="M326 362H456" fill="none" stroke="#6a6860" stroke-opacity="0.65" stroke-width="18" stroke-linecap="round"/>
      <rect x="270" y="294" width="260" height="316" rx="44" fill="none" stroke="#4a4943" stroke-width="24"/>
    </g>

    <g>
      <rect x="366" y="350" width="260" height="316" rx="44" fill="#1e1d1a"/>
      <path d="M422 418H552" fill="none" stroke="#a09c92" stroke-opacity="0.58" stroke-width="18" stroke-linecap="round"/>
      <rect x="366" y="350" width="260" height="316" rx="44" fill="none" stroke="#77746b" stroke-width="24"/>
    </g>

    <!-- Foreground session: all content is clipped to the frame's inner edge. -->
    <g>
      <rect x="462" y="406" width="260" height="316" rx="44" fill="#25241f"/>
      <g clip-path="url(#frontInterior)">
        <rect x="595" y="585" width="115" height="125" fill="url(#amber)"/>
        <path d="M474 585H710M595 585V710" fill="none" stroke="#3a3934" stroke-width="18"/>
        <path d="M621 617H676" fill="none" stroke="#5d401d" stroke-opacity="0.52" stroke-width="14" stroke-linecap="round"/>
      </g>
      <path d="M518 474H648" fill="none" stroke="#e6e3dc" stroke-opacity="0.83" stroke-width="18" stroke-linecap="round"/>
      <rect x="462" y="406" width="260" height="316" rx="44" fill="none" stroke="url(#edge)" stroke-width="24"/>
    </g>
  </g>
</svg>
